name: Build & Push to GHCR

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: ./server
            image: shareaux-server
          - context: ./client
            image: shareaux-client
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Get version from package.json
        run: echo "VERSION=$(node -p "require('./${{ matrix.context }}/package.json').version")" >> $GITHUB_ENV

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Delete untagged versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS=$(gh api \
            "/users/${{ env.OWNER }}/packages/container/${{ matrix.image }}/versions" \
            --paginate --jq '.[] | select(.metadata.container.tags | length == 0) | .id')
          for id in $VERSIONS; do
            gh api --method DELETE \
              "/users/${{ env.OWNER }}/packages/container/${{ matrix.image }}/versions/$id" \
              2>/dev/null || true
          done
