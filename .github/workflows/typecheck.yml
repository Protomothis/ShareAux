name: Type Check

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            path: ./server
          - name: client
            path: ./client
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.path }}

      - run: npx tsc --noEmit
        working-directory: ${{ matrix.path }}
